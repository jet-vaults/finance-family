<div class="prefs-panel" id="prefs-panel" data-open="false">
  <h4>העדפות תצוגה</h4>
  <fieldset>
    <legend>ניגודיות</legend>
    <div class="seg">
      <label><input type="radio" name="contrast" value="auto"><span>רגילה</span></label>
      <label><input type="radio" name="contrast" value="high"><span>גבוהה</span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>גודל טקסט</legend>
    <div class="seg">
      <label><input type="radio" name="textsize" value="auto"><span>רגיל</span></label>
      <label><input type="radio" name="textsize" value="large"><span>גדול</span></label>
      <label><input type="radio" name="textsize" value="xlarge"><span>גדול מאוד</span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>תנועה ואנימציות</legend>
    <div class="seg">
      <label><input type="radio" name="motion" value="auto"><span>לפי המערכת</span></label>
      <label><input type="radio" name="motion" value="reduce"><span>מופחתת</span></label>
    </div>
  </fieldset>
  <fieldset>
    <legend>ערכת צבע</legend>
    <div class="seg">
      <label><input type="radio" name="theme" value="auto"><span>אוטומטי</span></label>
      <label><input type="radio" name="theme" value="light"><span>בהיר</span></label>
      <label><input type="radio" name="theme" value="dark"><span>כהה</span></label>
    </div>
  </fieldset>
  <button type="button" class="btn btn-secondary btn-sm prefs-reset">איפוס העדפות</button>
</div>
